name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
    # Review gh actions docs if you want to further define triggers, paths, etc
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#on

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: nschloe/action-cached-lfs-checkout@v1
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: true
          exclude: external/**

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Rspack persistent cache
      - name: Restore bundler cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache
          key: docusaurus-${{ runner.os }}-${{ hashFiles('yarn.lock', 'docusaurus.config.js') }}-${{ github.sha }}
          restore-keys: |
            docusaurus-${{ runner.os }}-${{ hashFiles('yarn.lock', 'docusaurus.config.js') }}-
            docusaurus-${{ runner.os }}-

      - name: Preprocess API
        run: yarn preprocess-api

      - name: Sync Crowdin
        timeout-minutes: 15
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: yarn crowdin:sync

      - name: Build website
        timeout-minutes: 40
        env:
          # Bound SSG worker memory
          DOCUSAURUS_SSG_WORKER_THREAD_RECYCLER_MAX_MEMORY: 800000000
        run: yarn build

      - name: Report resource usage
        if: always()
        run: |
          echo "--- memory ---"; free -h
          echo "--- disk ---"; df -h /
          echo "--- rspack cache ---"; du -sh node_modules/.cache 2>/dev/null || echo "none"

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          branch: gh-pages