name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
    # Review gh actions docs if you want to further define triggers, paths, etc
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#on

# Only one deploy at a time, pushes made meanwhile collapse into a single queued run (never cancels a deploy midway)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    steps:
      - uses: nschloe/action-cached-lfs-checkout@v1
        with:
          fetch-depth: 0
          # Full history for the "last updated" dates, but file contents only for the commit being built
          filter: blob:none
          submodules: true
          exclude: external/**

      # Rename detection would download old file contents one by one on a partial clone
      - name: Disable git rename detection
        run: git config diff.renames false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Rspack persistent cache, so unchanged modules are not recompiled
      - name: Restore Rspack cache
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/rspack
          key: rspack-all-${{ runner.os }}-${{ hashFiles('yarn.lock', 'docusaurus.config.js') }}-${{ github.sha }}
          restore-keys: |
            rspack-all-${{ runner.os }}-${{ hashFiles('yarn.lock', 'docusaurus.config.js') }}-

      - name: Preprocess API
        run: yarn preprocess-api

      # Translations come from the latest run of the Sync Crowdin workflow (crowdin.yml), the path list must stay identical to its save step
      - name: Restore translations
        id: translations
        uses: actions/cache/restore@v6
        with:
          path: |
            i18n
            src/api/.generated/*
            !src/api/.generated/en
          key: crowdin-${{ github.run_id }}
          restore-keys: |
            crowdin-

      # Only when no translations cache exists (first run, or it was evicted)
      - name: Sync Crowdin
        if: steps.translations.outputs.cache-matched-key == ''
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: yarn crowdin:sync

      # API files added since the last sync do not exist in the translated folders yet, so they fall back to English
      - name: Fill missing API translations
        run: |
          for dir in src/api/.generated/*/; do
            rsync -a --ignore-existing src/api/.generated/en/ "$dir"
          done

      - name: Build website
        run: yarn build

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5